# Production stack on one small VM: the API, Caddy for HTTPS (automatic
# Let's Encrypt certificate for $DOMAIN) and, only with the `localdb`
# profile, a Postgres container (deploy.sh enables it when DATABASE_URL
# points at `db`; a managed database needs none).
# Env: backend.env is your backend/.env as-is; prod.env (made by
# deploy.sh on first run, then edited on the server) overrides what
# must differ there: DATABASE_URL, JWT_SECRET, PUBLIC_BASE_URL, CORS,
# provider keys.
name: uxn
services:
  db:
    image: postgres:16
    profiles: [localdb]
    restart: unless-stopped
    env_file: [prod.env]
    environment:
      POSTGRES_USER: uxn
      POSTGRES_DB: uxnweb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uxn"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # The main image: it fetches the pinned compiler release for this
    # CPU (scripts/fetch-compiler.sh). Dockerfile.source builds it
    # from ../uxn-dsl instead (context ../../.., UXN_DSL for deploy.sh).
    build:
      context: ../..
      dockerfile: Dockerfile
    image: uxn-api
    restart: unless-stopped
    env_file: [backend.env, prod.env]
    environment:
      # The image's compiler, whatever backend.env says (a dev path).
      ETAL_BIN: /opt/etal/etal
      ETAL_SOURCE: local
      COMPILER_DIR: /opt/etal
      # The release the image fetched (bump-compiler.sh keeps it in sync).
      ETAL_VERSION: "v0.1.6"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: [prod.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy:
