services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uxn
      POSTGRES_PASSWORD: uxn
      POSTGRES_DB: uxnweb
    volumes:
      # PGDATA is version-locked: starting any OTHER postgres major
      # (e.g. :17) against this volume poisons it and :16 will refuse
      # to boot (FATAL: incompatible). Use a different volume/project
      # for other versions; recovery is `down -v` (dev data only).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uxn"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://uxn:uxn@db:5432/uxnweb
      # Baked release binary (see Dockerfile). NOT a checkout mount: a
      # host-built etal needs a newer glibc than this slim image
      # provides, so the mount would be a dead binary.
      ETAL_BIN: /opt/etal/etal
      ETAL_SOURCE: "release:v0.1.3"
      ETAL_VERSION: "0.1.3"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000,http://localhost:4321
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
