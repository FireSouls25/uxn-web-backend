[project]
name = "uxn-webpage-backend"
version = "0.1.0"
description = "Compile service for ETAL (Uxn DSL) — FastAPI + Postgres"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyjwt>=2.15.0",
  "bcrypt>=5.0.0",
  "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
